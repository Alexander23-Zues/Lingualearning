name: System checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python -m pip install -r requirements.txt pytest==8.4.2 pytest-asyncio==1.2.0
      - run: python -m pytest tests
        working-directory: services/api
      - run: python -m pytest tests/test_vercel_deployment.py
  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests
        working-directory: ml
  flutter:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.vercel/cache/pub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .vercel/cache/flutter-3.44.4
            .vercel/cache/pub
          key: flutter-3.44.4-${{ runner.os }}-${{ hashFiles('apps/linguakids_app/pubspec.lock') }}
      - run: python scripts/build_vercel.py --sdk-only
      - run: echo "$GITHUB_WORKSPACE/.vercel/cache/flutter-3.44.4/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: apps/linguakids_app
      - run: flutter analyze --no-pub
        working-directory: apps/linguakids_app
      - run: flutter test --no-pub
        working-directory: apps/linguakids_app
      - run: python scripts/build_vercel.py
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
