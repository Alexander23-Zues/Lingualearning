name: System checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python -m pip install -r requirements.txt pytest==8.4.2 pytest-asyncio==1.2.0
      - run: python -m pytest tests
        working-directory: services/api
      - run: python -m pytest tests/test_vercel_deployment.py tests/test_react_build.py tests/test_offline_collection.py tests/test_offline_restore.py tests/test_mission_placement.py tests/test_adventure_collection.py tests/test_mission_rewards.py tests/test_release_package.py
  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy==2.3.4 pytest==8.4.2
      - run: python -m pytest ml/tests
  inference-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy==2.3.4 pytest==8.4.2
      - run: python -m pytest tests
        working-directory: services/inference
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/linguakids_web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/linguakids_web
      - run: npm test -- --maxWorkers=1 --exclude 'src/live-*'
        working-directory: apps/linguakids_web
      - run: npm exec -- tsc -p tsconfig.adventure.json --noEmit
        working-directory: apps/linguakids_web
      - run: python scripts/build_react.py --preview
