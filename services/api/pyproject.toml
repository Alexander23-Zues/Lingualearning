[project]
name = "linguakids-api"
version = "1.0.0"
description = "Protected LinguaKids educator and administrator workflows"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.38.0",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
