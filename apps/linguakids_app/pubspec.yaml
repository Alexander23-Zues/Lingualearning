name: linguakids_app
description: Educator-led English-Filipino language and literacy application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  supabase_flutter: 2.18.3
  http: 1.6.0
  intl: 0.20.2
  shared_preferences: 2.5.5
  sqflite: 2.4.5
  path: 1.9.1
  path_provider: 2.1.6
  uuid: 4.5.1
  crypto: 3.0.7
  pdf: 3.13.1
  printing: 5.15.1
  flutter_tts: 4.2.5
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/linguakids-character-journey.png
    - assets/images/animal-story-atlas.png
    - assets/content/animal_collection.json
    - assets/content/grade_collection.json
